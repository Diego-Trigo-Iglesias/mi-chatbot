# Configuracion de Dependabot.
# Actualizaciones automaticas de dependencias y de las GitHub Actions.
# Comprobacion semanal, los lunes a las 04:00 (Europe/Madrid).

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/chatbot-frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Madrid"
  - package-ecosystem: "maven"
    directory: "/chatbot-backend/chatbot-backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Madrid"
